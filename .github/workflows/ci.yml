name: Build and verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require ARM runner
        run: test "$(uname -m)" = arm64 || test "$(uname -m)" = aarch64
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev pkg-config patchelf xvfb xauth dbus-x11 fonts-noto-cjk pandoc poppler-utils
      - name: macOS Pandoc
        if: runner.os == 'macOS'
        run: brew install pandoc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - run: node tools/test-platform.mjs
      - run: node tools/wordcount-test.mjs
      - run: node tools/test-localization.mjs
      - name: WebView regression checks
        if: runner.os != 'Linux'
        run: node tools/test-tauri.mjs --no-build
      - name: Linux WebView regression checks
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          GDK_BACKEND: x11
          RUST_BACKTRACE: '1'
        run: dbus-run-session -- xvfb-run -a node tools/test-tauri.mjs --no-build
      - name: Package
        run: npm run package:dir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: release/verification/
      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
            release/app/
            src-tauri/target/release/aropyt.exe
            src-tauri/target/release/aropyt
