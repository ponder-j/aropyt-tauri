name: Refresh existing 1.0.1 release assets

on:
  push:
    branches: [codex/publish-pdf-export-v1.0.1]
  workflow_dispatch:

concurrency:
  group: aropyt-refresh-v1.0.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    env:
      PDF_RELEASE_WORKDIR: ${{ runner.temp }}/aropyt-pdf-release
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Verify source CI
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run in 45419402345 45417902440 45418016710 45419209233; do
            test "$(gh api "repos/$REPO/actions/runs/$run" --jq '.conclusion')" = success
          done
          test "$(gh api "repos/$REPO/actions/runs/45419402345" --jq '.head_sha')" = cf34096e3c531f96baa50f7e8306aa8d3b112901
          test "$(gh api "repos/$REPO/actions/runs/45418016710" --jq '.head_sha')" = cf34096e3c531f96baa50f7e8306aa8d3b112901
          test "$(gh api "repos/$REPO/actions/runs/45417902440" --jq '.head_sha')" = bb45f8757885b1cc5a7ffcc44f4d35ccf57da2fa
          test "$(gh api "repos/$REPO/actions/runs/45419209233" --jq '.head_sha')" = 45ff859ae777ffd146bdac8084877cbe57b073a9
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45418016710
          name: release-files
          path: ${{ env.PDF_RELEASE_WORKDIR }}/x64-ci
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45419209233
          pattern: '*-linux-arm64'
          path: ${{ env.PDF_RELEASE_WORKDIR }}/arm-ci
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45417902440
          name: verification-macos-15
          path: ${{ env.PDF_RELEASE_WORKDIR }}/mac-local/verification-macos-15
      - name: Verify the installed Mac package and release inputs
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          root="$PDF_RELEASE_WORKDIR"
          mkdir -p "$root/mac-local/artifacts" "$root/previous-release" "$root/verified-rollback"
          gh api "repos/$REPO/releases/421408145" > "$root/previous-release/live.json"
          gh release download v1.0.1 --repo "$REPO" --pattern 'pdf-links-input-bb45f87--*' --dir "$root/mac-local/artifacts"
          gh release download v1.0.1 --repo "$REPO" --pattern 'Aropyt_1.0.1_verification.zip' --dir "$root/verified-rollback"
          node tools/pdf-release-once/verify-input.mjs
          cp tools/pdf-release-once/installed-check.json tools/pdf-release-once/updater-results.json "$root/mac-local/"
          cp tools/pdf-release-once/assemble.mjs tools/pdf-release-once/publish.ps1 "$root/"
          ln -s "$GITHUB_WORKSPACE" "$root/desktop"
          node "$root/assemble.mjs"
      - name: Replace the existing Release attachments
        shell: pwsh
        run: '& "$env:PDF_RELEASE_WORKDIR/publish.ps1"'
      - name: Verify the published release and clean staging inputs
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          root="$PDF_RELEASE_WORKDIR"
          gh api "repos/$REPO/releases/421408145" > "$root/online-with-staging.json"
          jq '.assets |= map(select(.name|startswith("pdf-links-input-bb45f87--")|not))' "$root/online-with-staging.json" > "$root/published.json"
          node tools/pdf-release-once/verify-published.mjs
          jq -r '.assets[] | select(.name|startswith("pdf-links-input-bb45f87--")) | .id' "$root/online-with-staging.json" |
            while read -r id; do gh api "repos/$REPO/releases/assets/$id" --method DELETE; done
          gh api "repos/$REPO/releases/421408145" > "$root/published.json"
          node tools/pdf-release-once/verify-published.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: publication-verification
          path: |
            ${{ env.PDF_RELEASE_WORKDIR }}/published.json
            ${{ env.PDF_RELEASE_WORKDIR }}/publish/SHA256SUMS.txt
          if-no-files-found: warn
