name: Package Linux ARM64

on:
  push:
    branches: [codex/pdf-export-linux-arm64-package]

permissions:
  contents: read

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cf34096e3c531f96baa50f7e8306aa8d3b112901
      - uses: docker/setup-buildx-action@v4
      - name: Build Linux ARM64 environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/linux.Dockerfile
          platforms: linux/arm64
          load: true
          tags: aropyt-release:arm64
          cache-from: type=gha,scope=linux-arm64
          cache-to: type=gha,scope=linux-arm64,mode=max
      - name: Build and test DEB and AppImage
        run: |
          docker run --name aropyt-release --init --platform linux/arm64 --shm-size=1g \
            -e GITHUB_SHA="$(git rev-parse HEAD)" -e CARGO_BUILD_JOBS=2 \
            -e WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 -e APPIMAGE_EXTRACT_AND_RUN=1 \
            aropyt-release:arm64 sh tools/release-linux-arm64.sh
      - name: Collect package and test outputs
        if: always()
        run: |
          mkdir -p release/artifacts release/verification
          if docker container inspect aropyt-release >/dev/null 2>&1; then
            docker cp aropyt-release:/app/release/verification/. release/verification/
            docker cp aropyt-release:/app/release/artifacts/. release/artifacts/
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-linux-arm64
          path: release/verification/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: installer-linux-arm64
          path: release/artifacts/
          if-no-files-found: error
