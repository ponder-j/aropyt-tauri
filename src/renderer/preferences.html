<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="supported-color-schemes" content="light dark">
  <title>Preferences</title>
  <!-- Photon stylesheet and control styling for the settings window. -->
  <link rel="stylesheet" href="../../vendor/styles/preferences.css">
  <link rel="stylesheet" href="../../vendor/styles/electron.css">
  <link rel="stylesheet" href="styles/preferences.css">
</head>
<body class="light">
  <div class="window">
    <div class="window-content">
      <div class="pref-body">
        <aside class="pref-sidebar">
          <input id="pref-search" class="pref-search" type="text" placeholder="Search for...">
          <nav class="pref-nav" id="pref-nav">
            <a class="pref-nav-item active" data-pane="files">Files</a>
            <a class="pref-nav-item" data-pane="editor">Editor</a>
            <a class="pref-nav-item" data-pane="image">Image</a>
            <a class="pref-nav-item" data-pane="markdown">Markdown</a>
            <a class="pref-nav-item" data-pane="export">Export</a>
            <a class="pref-nav-item" data-pane="appearance">Appearance</a>
            <a class="pref-nav-item" data-pane="general">General</a>
          </nav>
        </aside>
        <main class="pref-main">
          <div class="pref-pane" id="pref-content"></div>
        </main>
      </div>
    </div>
  </div>
  <script src="preferences.js"></script>
</body>
</html>
