<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="initial-scale=1">
  <meta name="supported-color-schemes" content="light dark">
  <title>Aropyt</title>
  <link rel="stylesheet" href="../../vendor/aropyt-lib/bootstrape/css/bootstrap.css">
  <link rel="stylesheet" href="../../vendor/aropyt-lib/diagram/css/mermaid.css">
  <link rel="stylesheet" href="../../vendor/styles/font-awesome-4.1.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="../../vendor/styles/ionicons-2.0.1/css/ionicons.min.css">
  <link rel="stylesheet" href="../../vendor/styles/aropyt-icon/style.css">
  <link rel="stylesheet" href="../../vendor/styles/aropyt-file-icon/style.css">
  <link rel="stylesheet" href="../../vendor/styles/base.css">
  <link rel="stylesheet" href="styles/app.css">
  <style id="theme_css"></style>
  <style id="user_css"></style>
</head>
<body class="aropyt-node custom-titlebar on-windows sidebar-hidden">

  <!-- ==================== title bar (frameless window) ==================== -->
  <header>
    <div id="top-titlebar" class="stopselect">
      <span id="w-titlebar-left">
        <span class="toolbar-icon" id="w-menu-btn">
          <span class="ty-menu-btn-area">
            <span class="ty-menu-btn-area-sub"></span>
            <span class="ty-menu-btn-area-sub"></span>
            <span class="ty-menu-btn-area-sub"></span>
          </span>
        </span>
        <span class="title-text" id="title-text">Aropyt</span>
      </span>
      <span id="w-traffic-lights">
        <span id="w-min" class="btn toolbar-icon" title="Minimize"><span class="ty-icon ty-minimize10"></span></span>
        <span id="w-max-group">
          <span id="w-max" class="btn toolbar-icon" title="Maximize"><span class="ty-icon ty-maximize10"></span></span>
          <span id="w-pin" class="btn toolbar-icon" title="Always on Top"><span class="ion-pin"></span></span>
        </span>
        <span id="w-unpin" class="btn toolbar-icon" title="Always on Top"><span class="ion-pin"></span></span>
        <span id="w-restore" class="btn toolbar-icon" title="Restore"><span class="ty-icon ty-window-restore"></span></span>
        <span id="w-close" class="btn toolbar-icon" title="Close"><span class="ty-icon ty-close10"></span></span>
      </span>
    </div>
  </header>

  <!-- ============================= work area ============================= -->
  <div id="app-body">

    <!-- outline popover -->
    <div class="dropdown-menu stopselect dropmenu" id="toc-dropmenu">
      <div class="outline-title-wrapper">
        <span class="outline-title">Outline</span>
        <span class="btn fa fa-arrow-circle-left" id="pin-outline-btn"></span>
      </div>
      <div class="divider outline-title-divider"></div>
      <div id="toc-content" class="outline-content" data-after-content="Outline is Empty."></div>
    </div>

    <!-- sidebar -->
    <div class="stopselect dropmenu sidebar-menu" id="aropyt-sidebar">
      <div class="sidebar-tabs" id="sidebar-tabs" role="tablist" aria-label="侧边栏">
        <button type="button" role="tab" class="sidebar-tab active" id="sidepanel-segmented-input-files" data-panel="files" aria-selected="true">文件</button>
        <button type="button" role="tab" class="sidebar-tab" id="sidepanel-segmented-input-outline" data-panel="outline" aria-selected="false">大纲</button>
        <button type="button" role="tab" class="sidebar-tab" id="sidebar-search-btn" data-panel="search" aria-selected="false" hidden>查找</button>
      </div>
      <div id="sidebar-search-reveal" aria-hidden="true" inert>
        <div class="sidebar-search-inner">
          <div id="file-library-search-panel" class="ty-sidebar-search-panel">
            <div class="sidebar-search-field">
              <input type="search" id="file-library-search-input" placeholder="查找" aria-label="查找文件内容" autocomplete="off" spellcheck="false">
              <div class="sidebar-search-options" role="group" aria-label="查找选项">
                <button type="button" id="sidebar-search-case" aria-label="区分大小写" title="区分大小写" aria-pressed="false"><svg class="icon" width="20" height="14" aria-hidden="true"><use href="#find-and-replace-icon-case"></use></svg></button>
                <button type="button" id="sidebar-search-word" aria-label="查找整个单词" title="查找整个单词" aria-pressed="false"><svg class="icon" width="20" height="14" aria-hidden="true"><use href="#find-and-replace-icon-word"></use></svg></button>
                <button type="button" id="sidebar-search-regex" aria-label="正则表达式" title="正则表达式" aria-pressed="false"><svg class="icon" width="20" height="14" aria-hidden="true"><use href="#find-and-replace-icon-regexp"></use></svg></button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="sidebar-content" id="sidebar-content">
        <div id="outline-content" class="outline-content sidebar-content-content" data-after-content="Outline is Empty." style="display:none"></div>
        <div id="file-library" class="sidebar-content-content active">
          <div id="file-library-tree" class="no-selection" data-state="empty"></div>
          <div id="file-library-list" class="no-selection">
            <div id="file-library-list-children" data-after-content="No Files Available"></div>
          </div>
        </div>
        <div id="file-library-search" class="sidebar-content-content" style="display:none">
          <div id="file-library-search-result" aria-live="polite" aria-busy="false"></div>
        </div>
      </div>
      <div id="ty-sidebar-footer" role="toolbar" aria-label="文件操作">
        <button type="button" class="footer-btn" id="sidebar-new-file-btn" title="新建文件" aria-label="新建文件"><i class="ion-ios7-plus-empty" aria-hidden="true"></i></button>
        <button type="button" class="sidebar-footer-main-item" id="sidebar-folder-btn" aria-haspopup="menu" aria-expanded="false"><span id="sidebar-footer-main-item-label" class="sidebar-footer-main-item-label">打开文件夹…</span></button>
        <button type="button" class="footer-btn" id="sidebar-menu-btn" title="更多操作" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false"><i class="fa fa-ellipsis-v" aria-hidden="true"></i></button>
        <button type="button" class="footer-btn" id="switch-file-list-btn" title="切换列表 / 树视图" aria-label="切换列表 / 树视图"><span class="ty-icon ty-list" aria-hidden="true"></span></button>
      </div>
    </div>
    <div id="aropyt-sidebar-resizer"><div class="aropyt-sidebar-resizer-bar"></div></div>

    <!-- document -->
    <content id="main-content">
      <div id="md-searchpanel" class="hide" role="search" aria-label="Find and Replace">
        <div class="ty-search-panel-row">
          <select id="search-panel-mode" aria-label="Search mode"><option value="find">Find</option><option value="replace">Find and Replace</option></select>
          <div class="search-panel-field">
            <input type="text" placeholder="Find" aria-label="Find" spellcheck="false" id="search-panel-input">
            <div class="search-panel-options">
              <button type="button" title="Case Sensitive" id="searchpanel-case-option-btn" class="searchpanel-search-option-btn" aria-pressed="false"><svg class="icon" width="20" height="14"><use xlink:href="#find-and-replace-icon-case"></use></svg></button>
              <button type="button" title="Whole Word" id="searchpanel-word-option-btn" class="searchpanel-search-option-btn" aria-pressed="false"><svg class="icon" width="20" height="14"><use xlink:href="#find-and-replace-icon-word"></use></svg></button>
              <button type="button" title="Regular Expression" id="searchpanel-regexp-option-btn" class="searchpanel-search-option-btn" aria-pressed="false"><svg class="icon" width="20" height="14"><use xlink:href="#find-and-replace-icon-regexp"></use></svg></button>
            </div>
          </div>
          <button type="button" id="search-panel-prev" aria-label="Previous match"><span class="ion-chevron-up"></span></button>
          <button type="button" id="search-panel-next" aria-label="Next match"><span class="ion-chevron-down"></span></button>
          <span id="search-panel-status" role="status" aria-live="polite"></span>
          <button type="button" id="search-panel-close" aria-label="Close"><span class="ion-close-round"></span></button>
        </div>
        <div class="ty-search-panel-row ty-replace-panel-row">
          <label id="search-panel-replace-label" for="search-panel-replace-input">Replace</label>
          <div class="search-panel-field"><input type="text" placeholder="Replace with" spellcheck="false" id="search-panel-replace-input"></div>
          <button type="button" id="search-panel-replace-btn">Replace</button>
          <button type="button" id="search-panel-replaceall-btn">Replace All</button>
        </div>
      </div>

      <div id="aropyt-quick-open" style="display:none">
        <div id="aropyt-quick-open-input">
          <input type="text" tabindex="1" spellcheck="false" value="" placeholder="Search by file name" id="quick-open-input">
        </div>
        <div class="aropyt-quick-open-list" id="aropyt-quick-open-list">
          <div class="ty-quick-open-category" id="ty-quick-open-folder-category">
            <div class="ty-quick-open-category-title">Pinned and Recent Locations</div>
            <div id="ty-quick-open-folder-list-inner" class="ty-quick-open-category-list-inner"></div>
          </div>
          <div class="ty-quick-open-category" id="ty-quick-open-recent-category">
            <div class="ty-quick-open-category-title">Recent Files</div>
            <div id="ty-quick-open-recent-list-inner" class="ty-quick-open-category-list-inner"></div>
          </div>
          <div class="ty-quick-open-category" id="ty-quick-open-infolder-category">
            <div class="ty-quick-open-category-title">File Results</div>
            <div class="aropyt-quick-open-list-inner"></div>
          </div>
        </div>
      </div>

      <div class="md-notification-container"><div id="md-notification"></div></div>

      <div id="write" class="ty-before-first-render"><div id="md-editor"></div></div>
    </content>
    <!-- ============================== status bar ============================= -->
    <footer id="ty-footer" class="ty-footer">
      <div class="footer-left">
        <button type="button" class="footer-item footer-btn" id="footer-sidebar-btn" title="显示 / 隐藏侧边栏" aria-label="显示 / 隐藏侧边栏" aria-pressed="false"><i class="fa fa-circle-o" aria-hidden="true"></i></button>
        <button type="button" class="footer-item footer-btn" id="toggle-sourceview-btn" title="启用源代码模式" aria-label="启用源代码模式" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5 1 10 6 15M14 5 19 10 14 15M12 4 8 16"/></svg><span class="footer-source-label" aria-hidden="true">退出源代码模式</span></button>
      </div>
      <div class="footer-right">
        <button type="button" class="footer-item footer-btn" id="footer-spell-check" title="拼写检查" aria-label="拼写检查" aria-haspopup="dialog" aria-expanded="false"><span class="ty-icon ty-spellcheck" aria-hidden="true"></span></button>
        <button type="button" class="footer-item ty-footer-word-count" id="footer-word-count" title="字数统计" aria-label="字数统计" aria-haspopup="menu" aria-expanded="false">
          <span class="footer-word-count-label" id="footer-word-count-label">0 words</span>
          <span class="footer-count-arrows" aria-hidden="true"><i class="ion-chevron-up"></i><i class="ion-chevron-down"></i></span>
        </button>
      </div>
    </footer>
  </div>

  <svg style="position:absolute;width:0;height:0" aria-hidden="true">
    <defs>
      <symbol id="find-and-replace-icon-case" viewBox="0 0 20 14"><text x="1" y="11" font-size="12" font-family="sans-serif">Aa</text></symbol>
      <symbol id="find-and-replace-icon-word" viewBox="0 0 20 14"><text x="1" y="10" font-size="10" font-family="sans-serif">ab</text><rect x="0" y="11.5" width="16" height="1.6"></rect></symbol>
      <symbol id="find-and-replace-icon-regexp" viewBox="0 0 20 14"><text x="0" y="11" font-size="11" font-family="monospace">.*</text></symbol>
    </defs>
  </svg>

  <script src="app.js"></script>
</body>
</html>
