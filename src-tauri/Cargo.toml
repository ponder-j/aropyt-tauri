[package]
name = "aropyt"
version = "1.0.1"
description = "Aropyt Markdown editor"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deser-hjson = "2"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
trash = "5"
url = "2"
percent-encoding = "2"
pathdiff = "0.2"
tempfile = "3"
cld2-sys = "1.0.2"
chrono = "0.4"
shlex = "1"
wait-timeout = "0.2"
pulldown-cmark = "0.13"
tauri-plugin-updater = "2"


[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
gio = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
